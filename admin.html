<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diinle Admin — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff;--bg-2:#f6f6f7;--bg-3:#efeff1;
  --fg:#0a0a0a;--fg-2:#555557;--fg-3:#8a8a8d;
  --border:rgba(10,10,10,.08);--border-2:rgba(10,10,10,.14);
  --accent:#0a0a0a;--accent-fg:#fff;
  --success:#16a34a;--danger:#dc2626;--warn:#d97706;--info:#3b82f6;
  --shadow-sm:0 1px 2px rgba(10,10,10,.05);
  --shadow-md:0 6px 24px -8px rgba(10,10,10,.12);
  --shadow-lg:0 24px 60px -20px rgba(10,10,10,.22);
  --radius:14px;
  --ease:cubic-bezier(.22,1,.36,1);
}
[data-theme="dark"]{
  --bg:#08080a;--bg-2:#101013;--bg-3:#18181c;
  --fg:#f4f4f5;--fg-2:#a1a1a6;--fg-3:#6e6e73;
  --border:rgba(255,255,255,.08);--border-2:rgba(255,255,255,.14);
  --accent:#f4f4f5;--accent-fg:#08080a;
  --shadow-md:0 6px 24px -8px rgba(0,0,0,.6);
  --shadow-lg:0 24px 60px -20px rgba(0,0,0,.8);
}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg-2);color:var(--fg);line-height:1.55;-webkit-font-smoothing:antialiased;transition:background-color .4s var(--ease),color .4s var(--ease)}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4{font-weight:600;letter-spacing:-.02em;line-height:1.15}
h1{font-size:1.6rem}
.serif{font-family:'Fraunces',Georgia,serif;font-weight:400}
.icon{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.icon-sm{width:14px;height:14px}
.muted{color:var(--fg-3)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:999px;font-weight:500;font-size:.9rem;border:1px solid transparent;cursor:pointer;transition:all .25s var(--ease);white-space:nowrap}
.btn-primary{background:var(--accent);color:var(--accent-fg)}
.btn-primary:hover{transform:translateY(-1px)}
.btn-ghost{background:transparent;color:var(--fg);border-color:var(--border-2)}
.btn-ghost:hover{background:var(--bg-2)}
.btn-sm{padding:7px 13px;font-size:.82rem}
.btn-icon{width:38px;height:38px;padding:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;transition:background-color .2s}
.btn-icon:hover{background:var(--bg-2)}
.btn-danger{color:var(--danger);border-color:var(--danger)}
.btn-danger:hover{background:color-mix(in srgb,var(--danger) 10%,transparent)}
.btn-icon-sm{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);display:inline-flex;align-items:center;justify-content:center;transition:all .2s;background:var(--bg)}
.btn-icon-sm:hover{background:var(--bg-2);border-color:var(--border-2)}

/* Login */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg-2)}
.login-card{width:100%;max-width:420px;padding:36px;background:var(--bg);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow-md)}
.logo{font-family:'Fraunces',serif;font-weight:500;font-size:1.4rem;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.logo-mark{width:26px;height:26px;border-radius:7px;background:var(--accent);color:var(--accent-fg);display:inline-flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;font-weight:700;font-size:.85rem;letter-spacing:-.05em}

/* Fields */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:.82rem;font-weight:500;color:var(--fg-2)}
.field input,.field select,.field textarea{padding:12px 14px;border:1px solid var(--border-2);border-radius:10px;background:var(--bg);font-size:.92rem;outline:none;transition:border-color .2s;font-family:inherit}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--fg)}
.field textarea{resize:vertical;min-height:80px}
.field input:read-only,.field input[readonly]{background:var(--bg-2);color:var(--fg-2);cursor:not-allowed}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field.full{grid-column:span 2}
.err{font-size:.76rem;color:var(--danger);display:none}
.field.invalid input{border-color:var(--danger)}
.field.invalid .err{display:block}
@media(max-width:520px){.field-row{grid-template-columns:1fr}.field.full{grid-column:span 1}}

/* Layout */
.admin{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
@media(max-width:900px){.admin{grid-template-columns:1fr}}
.side{background:var(--bg);border-right:1px solid var(--border);padding:24px 16px;position:sticky;top:0;height:100vh;overflow-y:auto}
@media(max-width:900px){.side{position:fixed;top:0;left:0;bottom:0;width:260px;z-index:200;transform:translateX(-100%);transition:transform .4s var(--ease)}.side.open{transform:translateX(0)}}
.side .logo{margin-bottom:24px;padding:0 10px}
.nav-list{display:flex;flex-direction:column;gap:2px}
.nav-list a{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;font-size:.9rem;color:var(--fg-2);transition:all .2s;cursor:pointer}
.nav-list a:hover{background:var(--bg-2);color:var(--fg)}
.nav-list a.active{background:var(--accent);color:var(--accent-fg)}
.nav-list a .badge{margin-left:auto;font-size:.7rem;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--bg-3);color:var(--fg-2)}
.nav-list a.active .badge{background:color-mix(in srgb,var(--accent-fg) 20%,transparent);color:var(--accent-fg)}

.main{padding:28px 32px;overflow-x:hidden}
@media(max-width:640px){.main{padding:20px 16px}}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px;flex-wrap:wrap}
.top h1{font-family:'Fraunces',serif;font-weight:500}
.top .sub{font-size:.85rem;color:var(--fg-3);margin-top:2px}
.menu-btn{display:none;width:40px;height:40px;border-radius:10px;background:var(--bg);border:1px solid var(--border);align-items:center;justify-content:center}
@media(max-width:900px){.menu-btn{display:inline-flex}}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:150;opacity:0;pointer-events:none;transition:opacity .3s}
.backdrop.open{opacity:1;pointer-events:auto}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.stats{grid-template-columns:1fr}}
.stat{background:var(--bg);border:1px solid var(--border);padding:20px;border-radius:var(--radius)}
.stat .lbl{font-size:.74rem;color:var(--fg-3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;font-weight:600}
.stat .v{font-family:'Fraunces',serif;font-size:1.7rem;font-weight:500;letter-spacing:-.03em}
.stat .delta{font-size:.76rem;margin-top:6px;color:var(--fg-3)}
.stat .delta.up{color:var(--success)}
.stat .delta.warn{color:var(--warn)}

/* Card */
.card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:20px}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px;flex-wrap:wrap}
.card-head h3{font-size:1.05rem}

/* Chart */
.chart{display:flex;align-items:flex-end;gap:8px;height:170px;margin-top:8px}
.chart .bar{flex:1;background:linear-gradient(var(--accent),color-mix(in srgb,var(--accent) 40%,transparent));border-radius:4px 4px 0 0;position:relative;transition:all .6s var(--ease);min-height:8px}
.chart-labels{display:flex;gap:8px;margin-top:8px;font-size:.7rem;color:var(--fg-3)}
.chart-labels span{flex:1;text-align:center}

/* Table */
table{width:100%;border-collapse:collapse;font-size:.88rem}
thead{background:var(--bg-2)}
th{text-align:left;padding:13px 18px;font-weight:600;font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-3)}
td{padding:13px 18px;border-top:1px solid var(--border);vertical-align:middle}
tbody tr{transition:background-color .15s}
tbody tr:hover{background:var(--bg-2)}
.table-scroll{overflow-x:auto}
.table-scroll table{min-width:640px}

/* Status pill */
.status{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:.72rem;font-weight:500;white-space:nowrap}
.status.pending{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.status.processing{background:color-mix(in srgb,var(--info) 14%,transparent);color:var(--info)}
.status.paid,.status.delivered{background:color-mix(in srgb,var(--success) 14%,transparent);color:var(--success)}
.status.shipped{background:color-mix(in srgb,#8b5cf6 14%,transparent);color:#8b5cf6}
.status.cancelled{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
.status .dot{width:6px;height:6px;border-radius:50%;background:currentColor}

/* Product cell */
.prod-cell{display:flex;align-items:center;gap:12px}
.prod-thumb{width:44px;height:44px;border-radius:10px;background:var(--bg-2);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.prod-thumb svg{width:60%;height:60%}
.row-actions{display:flex;gap:6px;justify-content:flex-end}

/* Empty */
.empty{text-align:center;padding:60px 20px;color:var(--fg-3)}
.empty h3{color:var(--fg);margin-bottom:8px}

/* Toasts */
.toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{padding:12px 18px;border-radius:999px;background:var(--accent);color:var(--accent-fg);font-size:.85rem;font-weight:500;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow-lg);animation:toastIn .4s var(--ease),toastOut .4s var(--ease) 2.6s forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(24px)}}

/* Filter bar */
.filter-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.filter-bar input,.filter-bar select{padding:9px 14px;border:1px solid var(--border-2);border-radius:10px;background:var(--bg);font-size:.86rem;outline:none;min-width:0}
.filter-bar input:focus,.filter-bar select:focus{border-color:var(--fg)}
.filter-bar input{flex:1;min-width:180px}

/* Order tabs */
.order-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.order-tab{padding:8px 14px;border-radius:999px;font-size:.82rem;font-weight:500;color:var(--fg-2);background:var(--bg-2);border:1px solid transparent;transition:all .2s;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.order-tab:hover{background:var(--bg-3);color:var(--fg)}
.order-tab.active{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.order-tab .cnt{font-size:.72rem;font-weight:600;padding:1px 7px;border-radius:999px;background:color-mix(in srgb,var(--fg) 8%,transparent);color:var(--fg-2)}
.order-tab.active .cnt{background:color-mix(in srgb,var(--accent-fg) 20%,transparent);color:var(--accent-fg)}
.order-tab.tab-pending.active{background:var(--warn);border-color:var(--warn);color:#fff}
.order-tab.tab-processing.active{background:var(--info);border-color:var(--info);color:#fff}
.order-tab.tab-paid.active,.order-tab.tab-delivered.active{background:var(--success);border-color:var(--success);color:#fff}
.order-tab.tab-shipped.active{background:#8b5cf6;border-color:#8b5cf6;color:#fff}
.order-tab.tab-cancelled.active{background:var(--danger);border-color:var(--danger);color:#fff}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:400;opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
.modal-bg.open{opacity:1;pointer-events:auto}
.modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.95);z-index:401;background:var(--bg);border:1px solid var(--border);border-radius:18px;width:min(640px,94vw);max-height:90vh;overflow-y:auto;opacity:0;pointer-events:none;transition:all .35s var(--ease);box-shadow:var(--shadow-lg)}
.modal.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.modal-head{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--bg);z-index:1}
.modal-head h3{font-size:1.1rem}
.modal-body{padding:24px}
.modal-foot{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:0;background:var(--bg)}
.check-row{display:flex;gap:18px;flex-wrap:wrap;padding-top:6px}
.check-row label{display:flex;align-items:center;gap:8px;font-size:.88rem;cursor:pointer;color:var(--fg-2)}
.check-row input{width:16px;height:16px;accent-color:var(--accent)}

/* Order detail drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--bg);border-left:1px solid var(--border);z-index:210;transform:translateX(100%);transition:transform .5s var(--ease);display:flex;flex-direction:column}
.drawer.open{transform:translateX(0)}
.drawer-head{padding:20px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.drawer-body{flex:1;overflow-y:auto;padding:20px 24px}
.detail-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:.88rem;gap:16px}
.detail-row:last-child{border:none}
.detail-row .k{color:var(--fg-3)}
.detail-row .v{font-weight:500;text-align:right}
.backdrop-modal{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:205;opacity:0;pointer-events:none;transition:opacity .3s}
.backdrop-modal.open{opacity:1;pointer-events:auto}

/* Settings section */
.settings-section{padding:20px 0;border-bottom:1px solid var(--border)}
.settings-section:last-child{border-bottom:none}
.settings-section h4{font-size:.85rem;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-3);font-weight:600;margin-bottom:14px}
.settings-actions{display:flex;gap:10px;flex-wrap:wrap;padding-top:20px;border-top:1px solid var(--border);margin-top:8px;justify-content:flex-end}
</style>
</head>
<body>
<div id="app"></div>
<div class="toasts" id="toasts"></div>
<script src="admin.js"></script>
</body>
</html>
